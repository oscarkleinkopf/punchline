<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="chainBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111c24"/>
      <stop offset="50%" stop-color="#090e13"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <radialGradient id="chainAura" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="gridChain" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#chainBg)"/>
  <rect width="800" height="800" fill="url(#gridChain)"/>
  <circle cx="400" cy="380" r="320" fill="url(#chainAura)"/>

  <!-- Geometric Frame -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M 40 70 L 40 40 70 40 M 730 40 L 760 40 760 70 M 760 730 L 760 760 730 760 M 70 760 L 40 760 40 730" stroke="#00f0ff" stroke-width="3" stroke-linecap="square"/>

  <!-- Orbital Linking Rings (Topological Node Invariants) -->
  <g transform="translate(400, 360) rotate(-35)">
    <!-- Link 1 (Upper Left Möbius Loop) -->
    <rect x="-180" y="-70" width="200" height="140" rx="70" fill="#0c1d2e" stroke="url(#linkGrad)" stroke-width="14"/>
    <rect x="-165" y="-55" width="170" height="110" rx="55" fill="#070d14" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Intersecting Cutout Effect for Link 2 (Lower Right) -->
    <rect x="-20" y="-70" width="200" height="140" rx="70" fill="none" stroke="#fbbf24" stroke-width="14"/>
    <rect x="-5" y="-55" width="170" height="110" rx="55" fill="none" stroke="#fef08a" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Geometric Intersection Points (Topological Knot Coordinates) -->
    <circle cx="0" cy="-70" r="8" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="70" r="8" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Vector Tension Lines -->
  <line x1="160" y1="520" x2="640" y2="200" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <line x1="160" y1="200" x2="640" y2="520" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Annotation -->
  <g font-family="monospace" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="2">
    <text x="400" y="660" fill="#fbbf24" font-weight="bold" font-size="28" letter-spacing="4">CADENA</text>
    <text x="400" y="695" fill="#38bdf8" fill-opacity="0.8">[ NODO TOPOLÓGICO · ENLACE INVARIANTE ]</text>
    <text x="400" y="720" fill="#00f0ff" fill-opacity="0.4" font-size="11">BANDA DE MÖBIUS // RESISTENCIA TENSIL</text>
  </g>
</svg>