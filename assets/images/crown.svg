<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="crownBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1c160b"/>
      <stop offset="60%" stop-color="#0e0b05"/>
      <stop offset="100%" stop-color="#040301"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="gridCrown" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#crownBg)"/>
  <rect width="800" height="800" fill="url(#gridCrown)"/>
  <circle cx="400" cy="380" r="320" fill="url(#goldGlow)"/>

  <!-- Geometric Frame -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M 40 70 L 40 40 70 40 M 730 40 L 760 40 760 70 M 760 730 L 760 760 730 760 M 70 760 L 40 760 40 730" stroke="#fbbf24" stroke-width="3" stroke-linecap="square"/>

  <!-- Fibonacci Golden Ratio Circle Arcs -->
  <circle cx="400" cy="380" r="233" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="400" cy="380" r="144" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.3"/>
  <circle cx="400" cy="380" r="89" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Golden Crown Faceted Geometry (Sacred Polygons) -->
  <!-- Base headband with triangular facets -->
  <polygon points="200,480 600,480 580,440 220,440" fill="#171207" stroke="url(#goldCrownGrad)" stroke-width="3"/>
  <g stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="260" y1="480" x2="280" y2="440"/>
    <line x1="330" y1="480" x2="340" y2="440"/>
    <line x1="400" y1="480" x2="400" y2="440"/>
    <line x1="470" y1="480" x2="460" y2="440"/>
    <line x1="540" y1="480" x2="520" y2="440"/>
  </g>

  <!-- Crown Spikes (Golden Ratio Heights: 5 Spikes) -->
  <!-- Center Spike (Highest, phi ratio) -->
  <polygon points="400,180 360,440 440,440" fill="#241906" stroke="url(#goldCrownGrad)" stroke-width="3"/>
  <line x1="400" y1="180" x2="400" y2="440" stroke="#fef08a" stroke-width="2"/>

  <!-- Mid-Left Spike -->
  <polygon points="290,260 250,440 360,440" fill="#1c1406" stroke="url(#goldCrownGrad)" stroke-width="2.5"/>
  <line x1="290" y1="260" x2="310" y2="440" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Mid-Right Spike -->
  <polygon points="510,260 440,440 550,440" fill="#1c1406" stroke="url(#goldCrownGrad)" stroke-width="2.5"/>
  <line x1="510" y1="260" x2="490" y2="440" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Outer-Left Spike -->
  <polygon points="190,320 220,440 260,440" fill="#120c03" stroke="url(#goldCrownGrad)" stroke-width="2"/>

  <!-- Outer-Right Spike -->
  <polygon points="610,320 540,440 580,440" fill="#120c03" stroke="url(#goldCrownGrad)" stroke-width="2"/>

  <!-- Inscribed Vertex Gems (Platonic Solids) -->
  <circle cx="400" cy="180" r="10" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
  <circle cx="290" cy="260" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="510" cy="260" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="190" cy="320" r="6" fill="#fbbf24"/>
  <circle cx="610" cy="320" r="6" fill="#fbbf24"/>

  <!-- Central Diamond Prism -->
  <polygon points="400,340 430,390 400,440 370,390" fill="#0c1d29" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="400" cy="390" r="5" fill="#00f0ff"/>

  <!-- Annotation -->
  <g font-family="monospace" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="2">
    <text x="400" y="660" fill="#fbbf24" font-weight="bold" font-size="28" letter-spacing="4">CORONA</text>
    <text x="400" y="695" fill="#fef08a" fill-opacity="0.8">[ PROPORCIÓN ÁUREA · SUPREMACÍA DEL CÁLCULO ]</text>
    <text x="400" y="720" fill="#fbbf24" fill-opacity="0.4" font-size="11">Φ = 1.618033 · VÉRTICE DEL CAMPEÓN</text>
  </g>
</svg>