<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="fireBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#24100c"/>
      <stop offset="50%" stop-color="#140705"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>
    <radialGradient id="fireAura" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <pattern id="gridFire" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f43f5e" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#fireBg)"/>
  <rect width="800" height="800" fill="url(#gridFire)"/>
  <circle cx="400" cy="380" r="320" fill="url(#fireAura)"/>

  <!-- Geometric Frame -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M 40 70 L 40 40 70 40 M 730 40 L 760 40 760 70 M 760 730 L 760 760 730 760 M 70 760 L 40 760 40 730" stroke="#f43f5e" stroke-width="3" stroke-linecap="square"/>

  <!-- Isothermal & Thermodynamic Curves (Sacred Vortex Flames) -->
  <!-- Outer Flame Geometrical Envelope -->
  <path d="M 400 160 
           C 440 240, 520 290, 550 380 
           C 580 470, 510 560, 400 580 
           C 290 560, 220 470, 250 380 
           C 280 290, 360 240, 400 160 Z" 
        fill="#1a0806" stroke="url(#flameGrad)" stroke-width="3"/>

  <!-- Middle Plasma Vector -->
  <path d="M 400 230 
           C 430 300, 480 340, 490 410 
           C 500 480, 450 530, 400 545 
           C 350 530, 300 480, 310 410 
           C 320 340, 370 300, 400 230 Z" 
        fill="#260e0a" stroke="#fb923c" stroke-width="2.5"/>

  <!-- Core Ignition Kernel (High temperature yellow/white) -->
  <path d="M 400 320 
           C 420 370, 440 400, 440 440 
           C 440 480, 415 510, 400 515 
           C 385 510, 360 480, 360 440 
           C 360 400, 380 370, 400 320 Z" 
        fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Vector Isotherms (Geometric Energy Lines) -->
  <g stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4">
    <ellipse cx="400" cy="460" rx="120" ry="40"/>
    <ellipse cx="400" cy="400" rx="90" ry="30"/>
    <ellipse cx="400" cy="330" rx="55" ry="20"/>
  </g>

  <!-- Sparks & Thermodynamic Energy Nodes -->
  <circle cx="330" cy="240" r="4" fill="#fef08a"/>
  <circle cx="470" cy="210" r="5" fill="#fbbf24"/>
  <circle cx="400" cy="140" r="6" fill="#ffffff"/>
  <line x1="400" y1="120" x2="400" y2="150" stroke="#fbbf24" stroke-width="2"/>

  <!-- Annotation -->
  <g font-family="monospace" font-size="14" fill="#f43f5e" text-anchor="middle" letter-spacing="2">
    <text x="400" y="660" fill="#fbbf24" font-weight="bold" font-size="28" letter-spacing="4">FUEGO</text>
    <text x="400" y="695" fill="#fb923c" fill-opacity="0.8">[ ENTROPÍA TÉRMICA · GRADIENTE ENERGÉTICO ]</text>
    <text x="400" y="720" fill="#f43f5e" fill-opacity="0.5" font-size="11">ΔS &gt; 0 · COMBUSTIÓN DE BARS LÍRICOS</text>
  </g>
</svg>