<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="mirrorBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#09131a"/>
      <stop offset="100%" stop-color="#03070a"/>
    </radialGradient>
    <radialGradient id="mirrorAura" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="gridMirror" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#mirrorBg)"/>
  <rect width="800" height="800" fill="url(#gridMirror)"/>
  <circle cx="400" cy="380" r="320" fill="url(#mirrorAura)"/>

  <!-- Geometric Frame -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M 40 70 L 40 40 70 40 M 730 40 L 760 40 760 70 M 760 730 L 760 760 730 760 M 70 760 L 40 760 40 730" stroke="#38bdf8" stroke-width="3" stroke-linecap="square"/>

  <!-- Axial Symmetry Line (The Axis of Reflection: x = 0) -->
  <line x1="400" y1="120" x2="400" y2="580" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="10 6"/>

  <!-- Infinite Nested Octagons / Reflection Tunnel -->
  <polygon points="400,160 520,210 570,330 570,450 520,570 400,620 280,570 230,450 230,330 280,210" fill="#091824" stroke="url(#portalGrad)" stroke-width="3"/>
  <polygon points="400,210 490,250 530,340 530,440 490,530 400,570 310,530 270,440 270,340 310,250" fill="#0c2336" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="400,260 460,290 490,350 490,430 460,490 400,520 340,490 310,430 310,350 340,290" fill="#0f2e47" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.75"/>
  <polygon points="400,310 435,330 450,365 450,415 435,450 400,470 365,450 350,415 350,365 365,330" fill="#154063" stroke="#fbbf24" stroke-width="2"/>

  <!-- Vanishing Perspective Vector Lines -->
  <line x1="280" y1="210" x2="400" y2="390" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="520" y1="210" x2="400" y2="390" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="570" y1="330" x2="400" y2="390" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="230" y1="330" x2="400" y2="390" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="280" y1="570" x2="400" y2="390" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="520" y1="570" x2="400" y2="390" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Singularity Vertex Center -->
  <circle cx="400" cy="390" r="8" fill="#ffffff"/>
  <circle cx="400" cy="390" r="18" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- Annotation -->
  <g font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    <text x="400" y="660" fill="#fbbf24" font-weight="bold" font-size="28" letter-spacing="4">ESPEJO</text>
    <text x="400" y="695" fill="#38bdf8" fill-opacity="0.8">[ PLANO ESPECULAR · SIMETRÍA AXIAL f(-x) ]</text>
    <text x="400" y="720" fill="#00f0ff" fill-opacity="0.4" font-size="11">REFLEXIÓN INFINITA // DUALIDAD MENTAL</text>
  </g>
</svg>